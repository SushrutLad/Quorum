<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ doc_title }} - EUMS</title>
<style>
  @page { size: A4; }
  body { font-family: "Segoe UI", "Calibri", Arial, sans-serif; font-size: 10.5pt; line-height: 1.5; color: #111827; margin: 0;
         counter-reset: h2 figure table; }
  h1 { font-size: 20pt; margin: 0 0 6px; color: #0f2744; }
  h2 { font-size: 15pt; color: #0f2744; border-bottom: 2px solid #2563eb; padding-bottom: 4px; margin: 26px 0 10px;
       counter-increment: h2; counter-reset: h3; break-after: avoid; }
  h2::before { content: counter(h2) ". "; }
  h3 { font-size: 12pt; margin: 18px 0 6px; counter-increment: h3; break-after: avoid; color: #1e3a8a; }
  h3::before { content: counter(h2) "." counter(h3) " "; }
  h4 { font-size: 10.5pt; margin: 12px 0 4px; break-after: avoid; }
  h2.plain::before, h3.plain::before { content: none; }
  h2.plain { counter-increment: none; }
  p { margin: 6px 0; text-align: justify; }
  ul, ol { margin: 6px 0; padding-left: 22px; }
  li { margin: 2px 0; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 9.5pt; break-inside: auto; }
  tr { break-inside: avoid; }
  th { background: #0f2744; color: #fff; text-align: left; padding: 5px 7px; font-weight: 600; }
  td { border: 1px solid #d1d5db; padding: 5px 7px; vertical-align: top; }
  tr:nth-child(even) td { background: #f8fafc; }
  table.kv td:first-child { width: 28%; font-weight: 600; background: #f1f5f9; }
  caption { caption-side: bottom; font-size: 9pt; color: #475569; padding-top: 4px; counter-increment: table; }
  caption::before { content: "Table " counter(table) ": "; font-weight: 600; }
  figure { margin: 12px 0; text-align: center; break-inside: avoid; counter-increment: figure; }
  figure svg { max-width: 100%; max-height: 105mm; width: auto; height: auto; }
  figure.tall svg { max-height: 150mm; }
  figure img { max-width: 100%; height: auto; }
  figure img { border: 1px solid #d1d5db; border-radius: 4px; }
  figcaption { font-size: 9pt; color: #475569; margin-top: 4px; }
  figcaption::before { content: "Figure " counter(figure) ": "; font-weight: 600; }
  code, .mono { font-family: Consolas, "Courier New", monospace; font-size: 9pt; background: #f1f5f9; padding: 0 3px; border-radius: 3px; }
  pre { font-family: Consolas, "Courier New", monospace; font-size: 8.5pt; background: #f8fafc; border: 1px solid #e2e8f0;
        padding: 8px 10px; border-radius: 4px; white-space: pre-wrap; break-inside: avoid; }
  .page-break { break-before: page; }
  .pass { color: #15803d; font-weight: 700; }
  .fail { color: #b91c1c; font-weight: 700; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 8.5pt; font-weight: 600; }
  .must { background: #fee2e2; color: #991b1b; } .should { background: #fef3c7; color: #92400e; }
  .could { background: #dbeafe; color: #1e40af; } .wont { background: #f1f5f9; color: #475569; }
  .done { background: #dcfce7; color: #166534; } .wip { background: #fef3c7; color: #92400e; } .todo { background: #f1f5f9; color: #475569; }
  .note { border-left: 4px solid #2563eb; background: #eff6ff; padding: 8px 12px; margin: 10px 0; break-inside: avoid; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .formula { text-align: center; font-family: Cambria, "Times New Roman", serif; font-size: 11.5pt; margin: 8px 0; }
  .blank { border-bottom: 1px solid #9ca3af; display: inline-block; min-width: 120px; }
  /* cover */
  .cover { height: 255mm; display: flex; flex-direction: column; justify-content: space-between; break-after: page; }
  .cover .band { background: #0f2744; color: #fff; padding: 28px 30px; border-radius: 8px; }
  .cover .band h1 { color: #fff; font-size: 26pt; }
  .cover .band .sub { font-size: 13pt; color: #bfdbfe; }
  .cover .doc { font-size: 17pt; font-weight: 700; color: #2563eb; margin: 26px 0 6px; }
  .cover table td { font-size: 10.5pt; }
  .toc ol { list-style: none; padding: 0; columns: 1; }
  .toc li { border-bottom: 1px dotted #cbd5e1; padding: 3px 0; }
</style>
</head>
<body>
{% for s in sections %}{% include s + ".html" %}
{% endfor %}
</body>
</html>
