{% extends "base.html" %}
{% block title %}Add Meter Reading{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Add Meter Reading</h1><div class="crumbs"><a href="{{ url_for('staff.readings') }}">Meter Readings</a> / Add Reading</div></div></div>
<form class="card" method="post" id="readingForm">
  <div class="form-grid">
    <div><label for="meter_id">Meter ID</label>
      <select id="meter_id" name="meter_id" required>
        <option value="">Select a meter...</option>
        {% for m in meters %}<option value="{{ m.meter_id }}" {{ 'selected' if (form.meter_id or 0)|int == m.meter_id }}>{{ m.meter_no }} - {{ m.full_name }}</option>{% endfor %}
      </select></div>
    <div><label for="customer">Customer Name</label><input id="customer" readonly></div>
    <div><label for="utility">Utility Type</label><input id="utility" readonly></div>
    <div><label for="previous">Previous Reading <span id="unit1"></span></label><input id="previous" readonly>
      <div class="hint" id="prevDate"></div></div>
    <div><label for="reading_value">Current Reading <span id="unit2"></span></label>
      <input id="reading_value" name="reading_value" type="number" step="0.1" min="0" value="{{ form.reading_value }}" required>
      <div class="hint" id="readingHint"></div></div>
    <div><label for="consumption">Consumption</label><input id="consumption" readonly></div>
    <div><label for="reading_date">Reading Date</label><input id="reading_date" name="reading_date" type="date" value="{{ form.reading_date }}" required></div>
    <div class="span2"><label for="remarks">Remarks (optional)</label><input id="remarks" name="remarks" value="{{ form.remarks or '' }}" placeholder="Enter remarks..."></div>
  </div>
  <p class="hint">Saving the reading generates the bill automatically using the connection's tariff slabs.</p>
  <div class="actions"><a class="btn light" href="{{ url_for('staff.readings') }}">Cancel</a><button class="btn" id="saveBtn">Save Reading</button></div>
</form>
{% endblock %}
{% block scripts %}
<script>
  // When a meter is chosen, fetch its previous reading so consumption can be shown live.
  const meter = document.getElementById("meter_id");
  const current = document.getElementById("reading_value");
  let previous = null;

  async function loadMeter() {
    if (!meter.value) return;
    const info = await (await fetch(`{{ url_for('staff.meter_info', meter_id=0) }}`.replace("/0", "/" + meter.value))).json();
    previous = info.previous_value;
    document.getElementById("customer").value = info.full_name;
    document.getElementById("utility").value = info.utility;
    document.getElementById("previous").value = previous.toFixed(1);
    document.getElementById("prevDate").textContent = "Last read on " + info.previous_date;
    document.getElementById("unit1").textContent = document.getElementById("unit2").textContent = "(" + info.unit + ")";
    current.min = previous;
    update();
  }

  function update() {
    const hint = document.getElementById("readingHint");
    const value = parseFloat(current.value);
    if (previous === null || isNaN(value)) { document.getElementById("consumption").value = ""; hint.textContent = ""; return; }
    const used = value - previous;
    document.getElementById("consumption").value = used.toFixed(1);
    hint.textContent = used < 0 ? "Current reading cannot be lower than the previous reading." : "";
    hint.className = used < 0 ? "hint error" : "hint";
    document.getElementById("saveBtn").disabled = used < 0;
  }

  meter.addEventListener("change", loadMeter);
  current.addEventListener("input", update);
  loadMeter();
</script>
{% endblock %}
