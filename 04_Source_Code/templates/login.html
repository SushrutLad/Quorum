<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - EUMS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-page">
  <form class="login-box" method="post">
    <h1>EUMS Login</h1>
    <p class="muted">Energy &amp; Utility Management System</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <label for="username">Username or email</label>
    <input id="username" name="username" required autofocus>
    <label for="password" style="margin-top:14px">Password</label>
    <input id="password" name="password" type="password" required>
    <button class="btn block" style="margin-top:20px">Log in</button>
    <div class="demo-logins">
      Demo logins:<br>
      Admin <code>admin</code> / <code>admin123</code><br>
      Employee <code>reader</code> / <code>reader123</code><br>
      Customer <code>sushrut@example.com</code> / <code>pass123</code>
    </div>
  </form>
</div>
</body>
</html>
